<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007fff" />
      <stop offset="100%" stop-color="#1211ff" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" />

  <!-- Inner Soft Bevel Highlight -->
  <rect x="2" y="2" width="28" height="14" rx="7" fill="rgba(255,255,255,0.18)" />

  <!-- Git Branch / Pull Request Symbol with AI Sparkle -->
  <!-- Target Main Branch Line -->
  <path d="M10 8v16" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
  
  <!-- Branch Fork Curve -->
  <path d="M10 17c0-3 3-5 6-5h4" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Top Base Node -->
  <circle cx="10" cy="9" r="2.2" fill="#ffffff" />
  <!-- Bottom Base Node -->
  <circle cx="10" cy="23" r="2.2" fill="#ffffff" />

  <!-- PR Head Node (Target) with Sparkle Glow -->
  <circle cx="21" cy="12" r="2.8" fill="#ffffff" filter="url(#glow)" />
  <circle cx="21" cy="12" r="1.4" fill="#1211ff" />

  <!-- Mini AI Sparkle Star on Top Right -->
  <path d="M25 5.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z" fill="#ffea79" />
</svg>
